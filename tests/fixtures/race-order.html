<script id="__NEXT_DATA__" type="application/json">{"props": {"pageProps": {"blocks": [{"articleMetadata": {"article": {"title": "Final 2026 Breeders' Cup Race Order, Post Times, & Wagering Menu Announced", "url": "/news/2026/final-2026-breeders-cup-race-order-post-times-wagering-menu-Announced", "publishDate": "2026-10-21T14:15:00.000Z", "content": "<p style=\"text-align: center;\"><strong>$7 Million Longines Breeders\u2019 Cup Classic Set for 6:16 p.m. ET Oct. 31 as Two-Day International Festival of Racing Returns to Keeneland Race Course</strong></p><hr/><p><strong>LEXINGTON, Ky. (Oct. 21, 2026)</strong><strong> </strong>\u2013 Breeders\u2019 Cup Limited today unveiled the official race order, post times, and wagering menu for the 43<sup>rd </sup>Breeders\u2019 Cup World Championships Oct. 30-31 at Keeneland Race Course in Lexington, Ky.</p><p>The 2026 World Championships will again feature 14 Grade 1 races and more than $34 million in purses and awards, bringing together the sport\u2019s top horses, owners, breeders, trainers, and jockeys on racing\u2019s biggest stage. Keeneland will host the Breeders\u2019 Cup for the fourth time, having previously held the World Championships in 2015, 2020, and 2022.</p><p>The $7 million Longines Breeders\u2019 Cup Classic (G1) anchors a three-hour NBC broadcast window on Saturday (3:30\u20136:30 p.m. ET) as Race 12 <strong>with a post time of 6:16 p.m. ET</strong>. The centerpiece of the two-day international festival has all the ingredients of another racing tour de force, featuring Japanese superstar and defending Longines Breeders\u2019 Cup Classic winner <strong>Forever Young (JPN)</strong>, last year\u2019s Kentucky Derby (G1) and Belmont Stakes (G1) winner and Horse of the Year <strong>Sovereignty</strong>, and this year\u2019s Kentucky Derby and Belmont Stakes winner <strong>Golden Tempo</strong>. &nbsp;</p><p>NBC Sports and Peacock will present 10 1/2 hours of live coverage featuring all 14 Championship races across NBC and USA Network over the two days. Coverage begins Friday, Oct. 30, from 1-6 p.m. ET on USA Network and Peacock with Future Stars Friday, showcasing five Championship races exclusively for 2-year-olds. On Saturday, Oct. 31, coverage resumes from 1-3:30 p.m. ET on USA Network and Peacock before moving to NBC and Peacock from 3:30-6:30 p.m. ET, culminating with the $7 million Longines Breeders' Cup Classic at 6:16 p.m. ET.</p><p>FanDuel TV will present live, continuous coverage of every Championship and undercard race through the \u201cBreeders' Cup Players' Show,\u201d available on <a href=\"https://www.fanduel.com/watch\">FanDuel TV</a>, <a href=\"https://www.breederscup.com\">BreedersCup.com</a>, the official <a href=\"https://www.breederscup.com/app\">Breeders' Cup mobile app</a>, Breeders' Cup <a href=\"https://www.youtube.com/c/BreedersCupWorldChampionships/videos\">YouTube</a>, <a href=\"https://www.facebook.com/breederscup/\">Facebook</a>, and <a href=\"https://x.com/breederscup\">X</a> social channels, major advance-deposit wagering platforms, and simulcast outlets worldwide. New this year, the Players\u2019 Show will also be available on Peacock.</p><p>The World Championships begin Friday, Oct. 30, with a 10-race card beginning at 11:55 a.m. ET. Five undercard races precede the first Championships race \u2013 the Breeders\u2019 Cup Juvenile Turf Sprint (G1), Race 6, with a post time of 2:55 p.m. ET. The FanDuel Breeders\u2019 Cup Juvenile will be run as Race 9, with a post time of 4:55 p.m. ET. The Brown Advisory Breeders\u2019 Cup Juvenile Turf (G1), Race 10, will wrap the day with a post time of 5:35 p.m. ET.</p><p>The 12-race Saturday card begins at 11:15 a.m. ET with three undercard races before the Breeders\u2019 Cup Filly &amp; Mare Sprint (G1), Race 4, kicks off the Championships action with a post time of 1:10 p.m. ET.&nbsp; &nbsp; &nbsp;</p><p><span style=\"color: black;\">This year, 43 international jurisdictions are expected to wager on the Breeders\u2019 Cup World Championships through common and separate pool wagering, including Australia, England, France, Germany, Hong Kong, Japan, Ireland, Mexico, and Turkey.</span></p><p><span style=\"color: black;\">The 2026 wagering menu for the two-day World Championships will include a total of 10 Pick 4\u2019s, seven Pick 5\u2019s, two Pick 6\u2019s, and four special daily doubles.&nbsp;</span></p><p><span style=\"color: black;\"><br />On Friday, there will be a Breeders\u2019 Cup&nbsp;</span><span style=\"color: black;\"><strong>$3 All-Turf Pick 3</strong></span><span style=\"color: black;\">. The three races, in order, are:</span></p><ul><li><span style=\"color: black;\"><strong>Race 6:</strong></span><span style=\"color: black;\">&nbsp;Breeders\u2019 Cup Juvenile Turf Sprint (G1)</span></li><li><span style=\"color: black;\"><strong>Race 8:&nbsp;</strong></span><span style=\"color: black;\">John DeereBreeders\u2019 Cup Juvenile Fillies Turf (G1)</span></li><li><span style=\"color: black;\"><strong>Race 10:</strong></span><span style=\"color: black;\">&nbsp;Brown Advisory Breeders\u2019 Cup Juvenile Turf (G1)</span></li></ul><p><span style=\"color: black;\"></span></p><p><span style=\"color: black;\">The Breeders\u2019 Cup&nbsp;</span><span style=\"color: black;\"><strong>All-Turf Pick 4 on Saturday</strong></span><span style=\"color: black;\">&nbsp;is a 50-cent minimum wager and will package four of the best turf races in the world together with top-flight fields of international competitors. The four races, in order, are:</span></p><ul><li><span style=\"color: black;\"><strong>Race 5:&nbsp;</strong></span><span style=\"color: black;\">Prevagen Breeders\u2019 Cup Turf Sprint(G1)</span></li><li><span style=\"color: black;\"><strong>Race 7:</strong></span><span style=\"color: black;\">&nbsp;Maker\u2019s Mark Breeders\u2019 Cup Filly &amp; Mare Turf (G1)</span></li><li><span style=\"color: black;\"><strong>Race 9:&nbsp;</strong></span><span style=\"color: black;\">FanDuel Breeders\u2019 Cup Mile (G1)</span></li><li><span style=\"color: black;\"><strong>Race 11:&nbsp;</strong></span><span style=\"color: black;\">Longines Breeders\u2019 Cup Turf (G1)</span></li></ul><p><br /><span style=\"color: black;\">The Breeders\u2019 Cup will also offer the Breeders\u2019 Cup&nbsp;</span><span style=\"color: black;\"><strong>All-Dirt Pick 4 on Saturday</strong></span><span style=\"color: black;\">, which is a 50-cent minimum wager. The four races, in order, are:</span></p><ul><li><span style=\"color: black;\"><strong>Race 6:&nbsp;</strong></span><span style=\"color: black;\">Breeders\u2019 Cup Dirt Mile (G1)</span></li><li><span style=\"color: black;\"><strong>Race 8:&nbsp;</strong></span><span style=\"color: black;\">Cygames Breeders\u2019 Cup Sprint (G1)</span></li><li><span style=\"color: black;\"><strong>Race 10:&nbsp;</strong></span><span style=\"color: black;\">Longines Breeders\u2019 Cup Distaff (G1)</span></li><li><span style=\"color: black;\"><strong>Race 12:&nbsp;</strong></span><span style=\"color: black;\">Longines Breeders\u2019 Cup Classic (G1)</span></li></ul><p><span style=\"color: black;\"><strong></strong></span></p><p><span style=\"color: black;\">Breeders\u2019 Cup will also offer four Pick 5\u2019s on Saturday. The early Pick 5 will be Race 1 through Race 5. The next Pick 5 will be Race 3 through Race 7. The third Pick 5 will start with Race 5, the Breeders\u2019 Cup Turf Sprint, and end with Race 9, the Breeders\u2019 Cup Mile. The late Pick 5 will start with Race 8, the Breeders\u2019 Cup Sprint, and end with Race 12, the Longines Breeders\u2019 Cup Classic.</span></p><p><span style=\"color: black;\">There will be&nbsp;</span><span style=\"color: black;\"><strong>four Special Daily Doubles</strong></span><span style=\"color: black;\">&nbsp;(\u201cSPDD\u201d) across the two days as follows:</span></p><ul><li><span style=\"color: black;\">Friday R7: Breeders\u2019 Cup Juvenile Fillies with Saturday R10: Longines Breeders\u2019 Cup Distaff</span></li></ul><ul><li><span style=\"color: black;\">Friday R9: Breeders\u2019 Cup Juvenile with Saturday R12: Longines Breeders\u2019 Cup Classic</span></li><li><span style=\"color: black;\">Friday R10: Breeders\u2019 Cup Juvenile Turf with Saturday R11: Longines Breeders\u2019 Cup Turf&nbsp;</span></li></ul><ul><li><span style=\"color: black;\">Saturday R10: Longines Breeders\u2019 Cup Distaff to Saturday R12: Longines Breeders\u2019 Cup Classic</span></li></ul><p><span style=\"color: black;\"></span></p><p><strong>Wagering Notes</strong></p><ul><li><span style=\"color: rgb(23, 23, 23);\">Friday\u2019s Pick 6, Pick 5\u2019s, and Super High 5 may carry over to Saturday.</span></li><li><span style=\"color: rgb(23, 23, 23);\">Saturday\u2019s Pick 6 and Pick 5\u2019s are mandatory payouts.</span></li></ul><ul><li>Any Pick 5 carryover from Friday will roll over to the Late Pick 5 on Saturday.&nbsp;</li></ul><ul><li><span style=\"color: rgb(23, 23, 23);\">Saturday\u2019s Pick 6, Late Pick 5, and final Super High 5 will have a mandatory payout on Breeders\u2019 Cup Saturday.</span></li></ul><p><span style=\"color: rgb(238, 0, 0);\"></span></p><p><strong>Bet Minimums</strong></p><p>$3 All-Turf Pick 3, $3 Late Pick 3.</p><p>$1 WPS, Exacta, Daily Double, Pick 3, Pick 6, Super High 5, Special Daily Double. &nbsp;</p><p>50-cent Trifecta, Pick 4, All-Turf Pick 4, All-Dirt Pick 4, Pick 5.</p><p>10-cent Superfecta.</p><img asset_uid=\"blt6d1268d617131112\" width=\"auto\" height=\"auto\" src=\"https://images.contentstack.io/v3/assets/blt9b0ea57b1efe7a70/blt6d1268d617131112/6ad80afe18f58c600a766b94/26-280-007_BCWC_Post_Times-TV_Coverage_Chart.jpg\" alt=\"26-280-007 BCWC Post Times-TV Coverage Chart.jpg\" max-width=\"auto\" style=\"width: auto;height: auto;max-width: auto;\"/><p><br /><strong>2026 BREEDERS\u2019 CUP POST TIMES AND WAGERING MENU</strong><strong ><br bold=\"[object Object]\"/></strong></p><table><colgroup data-width='1217.0006302000772'><col
